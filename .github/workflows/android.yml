.github/workflows/android.yml
name: Build Nikhil Motion Studio APK

on:
workflow_dispatch:
push:
branches: [main]

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Extract Android project ZIP
    run: |
      mkdir -p extracted
      ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
      test -n "$ZIP" || (echo "Project ZIP not found" && exit 1)
      unzip -o "$ZIP" -d extracted
      find extracted -name settings.gradle.kts -print

  - name: Build debug APK
    run: |
      PROJECT=$(find extracted -name settings.gradle.kts -print -quit | xargs dirname)
      cd "$PROJECT"
      gradle --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: NikhilMotionStudio-debug-apk
      path: extracted/**/build/outputs/apk/debug/*.apk
